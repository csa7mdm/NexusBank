openapi: 3.1.0
info:
  title: NexusBank Core Banking API
  version: 1.0.0
  description: |
    Production-grade digital banking API for Customer, Account, Transaction and KYC domains.

servers:
  - url: https://api.nexusbank.com/v1
  - url: http://localhost:5000/api

tags:
  - name: Customers
    description: Customer lifecycle and profile management.
  - name: Accounts
    description: Bank account lifecycle and balance management.
  - name: Transactions
    description: Immutable ledger handling value transfers.
  - name: KYC
    description: Identity verification and compliance workflows.

security:
  - OAuth2: [openid, profile]

paths:

  ################################
  # CUSTOMER
  ################################
  /customers:
    get:
      tags: [Customers]
      summary: List customers
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

    post:
      tags: [Customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"

  /customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/CustomerId"

    get:
      tags: [Customers]
      summary: Get customer by id
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Customers]
      summary: Update customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

    delete:
      tags: [Customers]
      summary: Soft delete customer
      responses:
        "204":
          description: Deleted

  ################################
  # KYC
  ################################
  /customers/{customerId}/kyc:
    parameters:
      - $ref: "#/components/parameters/CustomerId"

    get:
      tags: [KYC]
      summary: Retrieve KYC status
      responses:
        "200":
          description: KYC record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerification"

    post:
      tags: [KYC]
      summary: Submit KYC verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmission"
      responses:
        "202":
          description: KYC submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerification"

  ################################
  # ACCOUNTS
  ################################
  /accounts:
    post:
      tags: [Accounts]
      summary: Open account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"

    get:
      tags: [Accounts]
      summary: Get account
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

    delete:
      tags: [Accounts]
      summary: Close account
      responses:
        "204":
          description: Closed

  ################################
  # TRANSACTIONS
  ################################
  /transactions:
    post:
      tags: [Transactions]
      summary: Initiate transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transaction initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

    get:
      tags: [Transactions]
      summary: List transactions
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/{transactionId}/reverse:
    parameters:
    - $ref: "#/components/parameters/TransactionId"
    
    post:
      tags: [Transactions]
      summary: Reverse transaction
      responses:
        "200":
          description: Reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

components:

  ################################
  # SECURITY
  ################################
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://keycloak.nexusbank.com/auth
          tokenUrl: https://keycloak.nexusbank.com/token
          scopes:
            openid: OpenID access
            profile: Profile access

  ################################
  # PARAMETERS
  ################################
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  ################################
  # ERROR RESPONSES
  ################################
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  ################################
  # SCHEMAS
  ################################
  schemas:

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [Active, Suspended, Closed]
        kyc:
          $ref: "#/components/schemas/KycVerification"

    CreateCustomerRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
        name:
          type: string

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string

    ################################
    # KYC DOMAIN ENTITY
    ################################
    KycVerification:
      type: object
      properties:
        status:
          type: string
          enum: [Pending, Verified, Rejected]
        provider:
          type: string
        submittedAt:
          type: string
          format: date-time

    KycSubmission:
      type: object
      properties:
        documentType:
          type: string
        documentNumber:
          type: string

    ################################
    # ACCOUNT
    ################################
    Account:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        number:
          type: string
        balance:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [Open, Closed, Frozen]

    OpenAccountRequest:
      type: object
      properties:
        customerId:
          type: string
        currency:
          type: string

    ################################
    # TRANSACTION
    ################################
    Transaction:
      type: object
      properties:
        id:
          type: string
        sourceAccount:
          type: string
        destinationAccount:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
        fraudScore:
          type: number

    CreateTransactionRequest:
      type: object
      properties:
        sourceAccount:
          type: string
        destinationAccount:
          type: string
        amount:
          $ref: "#/components/schemas/Money"

    ################################
    # VALUE OBJECT
    ################################
    Money:
      type: object
      properties:
        amount:
          type: number
          format: decimal
        currency:
          type: string

    ################################
    # ERROR
    ################################
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
